<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>استعادة كلمة مرور إدارة الطلبات | جمعية تعلّم</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#edf4f3;color:#064f4d;margin:0;padding:30px 12px}main{max-width:450px;margin:6vh auto;background:white;border:1px solid #d5e4e1;border-radius:20px;padding:28px;box-shadow:0 10px 40px #004d4720}h1{text-align:center;font-size:1.5rem}label{display:block;margin:16px 0 8px}input,button{box-sizing:border-box;width:100%;border-radius:9px;border:1px solid #b9cfcb;padding:13px;font-size:1rem}button{background:#006b69;color:white;margin-top:18px;cursor:pointer}button:disabled{opacity:.6}#msg{margin-top:14px;line-height:1.8;white-space:pre-wrap}a{color:#006b69}</style></head>
<body><main><h1>تعيين كلمة مرور جديدة</h1><p>إدارة طلبات المعلمين – جمعية تعلّم</p><form id="form" hidden><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" minlength="10" autocomplete="new-password" required><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" minlength="10" autocomplete="new-password" required><button id="save" type="submit">حفظ كلمة المرور الجديدة</button></form><p id="msg" role="status">جارٍ التحقق من رابط الاستعادة…</p><a href="./admin/">العودة إلى إدارة الطلبات</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
const msg=document.getElementById('msg'),form=document.getElementById('form');
function show(t){msg.textContent=t}
if(!window.supabase){show('تعذر تحميل خدمة المصادقة. تحقق من الاتصال بالإنترنت.');return}
const client=window.supabase.createClient('https://fvzoogbdezueswyihxiz.supabase.co','sb_publishable_wqrt_5bjmxmE-mw4i6EQbw_I7E_AzaZ',{auth:{storageKey:'tallam-requests-recovery-v1',detectSessionInUrl:true,persistSession:true,autoRefreshToken:false}});
let verified=false;
client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){verified=true;form.hidden=false;show('تم التحقق من الرابط. أدخل كلمة مرور جديدة.')}});
try {
 const p=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));
 const error=p.get('error_description')||h.get('error_description');
 if(error)throw new Error(error);
 const tokenHash=p.get('token_hash'),type=p.get('type');
 if(tokenHash&&type==='recovery'){
   const {error:e}=await client.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
   if(e)throw e;
   verified=true;
 }
 const {data,error:e}=await client.auth.getSession();
 if(e)throw e;
 if(data.session && (verified||h.has('access_token')&&h.get('type')==='recovery')){
  verified=true;form.hidden=false;show('تم التحقق من الرابط. أدخل كلمة مرور جديدة.');
 }else if(!verified){show('رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا من صفحة إدارة الطلبات.')}
 if(verified)history.replaceState(null,'',location.pathname);
}catch(e){show('تعذر التحقق من رابط الاستعادة: '+(e.message||'خطأ غير معروف'))}
form.addEventListener('submit',async event=>{
 event.preventDefault();
 if(!verified)return show('يلزم فتح رابط استعادة صالح أولًا.');
 const pwd=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 if(pwd!==confirm)return show('كلمتا المرور غير متطابقتين.');
 if(pwd.length<10)return show('يجب أن تتكون كلمة المرور من 10 أحرف على الأقل.');
 const btn=document.getElementById('save');btn.disabled=true;show('جارٍ حفظ كلمة المرور…');
 try{const {error}=await client.auth.updateUser({password:pwd});if(error)throw error;await client.auth.signOut({scope:'local'});form.hidden=true;show('تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول من إدارة طلبات المعلمين.')}catch(e){show('تعذر تحديث كلمة المرور: '+(e.message||'خطأ غير معروف'))}finally{btn.disabled=false}
});
})();
</script></body></html>
